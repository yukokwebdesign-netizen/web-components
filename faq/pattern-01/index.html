<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>FAQ Accordion</title>
</head>
<body>

<div class="faq-list">
    <dl class="faq-item">
        <dt class="faq-q">
            質問テキスト1：よくあるご質問の文章がここに入ります
            <span class="faq-toggle"></span>
        </dt>
        <dd class="faq-a">
            回答テキスト1：質問に対する詳細な回答が入ります。
        </dd>
    </dl>
    <dl class="faq-item">
        <dt class="faq-q">
            質問テキスト2：別の質問文がここに入ります
            <span class="faq-toggle"></span>
        </dt>
        <dd class="faq-a">
            回答テキスト2：対応する回答が入ります。
        </dd>
    </dl>
</div>

<script src="script.js"></script>
</body>
</html>
