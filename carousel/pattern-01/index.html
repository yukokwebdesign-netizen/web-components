<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>header-pattern-01</title>
        <link rel="stylesheet" href="../../asset/reset.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="carousel-wrap">
  <div class="carousel" id="carousel">

    <div class="slides" id="slides">

      <!-- スライド 1 -->
      <div class="slide">
        <img class="slide-img"
             src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80"
             alt="山の風景">
        <div class="slide-body">
          <span class="slide-tag">自然</span>
          <p class="slide-title">静寂の山頂</p>
          <p class="slide-desc">雲の上に広がる絶景。標高3,000mから見下ろす景色は、日常の喧騒を忘れさせてくれます。</p>
        </div>
      </div>

      <!-- スライド 2 -->
      <div class="slide">
        <img class="slide-img"
             src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=800&q=80"
             alt="湖の風景">
        <div class="slide-body">
          <span class="slide-tag">旅行</span>
          <p class="slide-title">鏡のような湖面</p>
          <p class="slide-desc">夜明けの湖は空と山を映し出し、2つの世界が重なるような不思議な体験をもたらします。</p>
        </div>
      </div>

      <!-- スライド 3 -->
      <div class="slide">
        <img class="slide-img"
             src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800&q=80"
             alt="森の風景">
        <div class="slide-body">
          <span class="slide-tag">冒険</span>
          <p class="slide-title">緑の迷宮</p>
          <p class="slide-desc">光が差し込む深い森の中。苔むした岩と古木が作り出す回廊を歩けば、自然の偉大さを実感できます。</p>
        </div>
      </div>

      <!-- スライド 4 -->
      <div class="slide">
        <img class="slide-img"
             src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80"
             alt="ビーチの風景">
        <div class="slide-body">
          <span class="slide-tag">海</span>
          <p class="slide-title">果てしない水平線</p>
          <p class="slide-desc">波音だけが聞こえる砂浜。夕暮れに染まるオレンジの空と青い海が織りなす、一瞬の絵画。</p>
        </div>
      </div>

    </div><!-- /.slides -->

    <button class="btn btn-prev" id="prev" aria-label="前へ">&#8249;</button>
    <button class="btn btn-next" id="next" aria-label="次へ">&#8250;</button>

  </div><!-- /.carousel -->

  <div class="dots" id="dots"></div>
  <p class="counter" id="counter">1 / 4</p>
</div>

    <script src="script.js"></script>
    </body>
</html>
